name: CI

# Reproducibility/quality CI for BRCA-PathwayML (BMC AI revision, requirement E3).
on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools (pinned)
        run: pip install ruff==0.4.8 mypy==1.10.0
      - name: ruff
        run: ruff check .
      - name: mypy (non-blocking)
        run: mypy src scripts || true

  tests:
    name: tests (pytest)
    runs-on: ubuntu-latest
    # This job installs R + the genefu Bioconductor package so the official
    # PAM50-ROR regression test (tests/test_pam50_official.py) actually runs.
    # Without R/genefu that test auto-skips (see conftest.py); the rest of the
    # suite still runs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install R genefu (Bioconductor)
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install("genefu", ask=FALSE, update=FALSE)'
      - name: Install Python dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest tests/ -q

  consistency:
    name: consistency (recompute vs committed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies (pinned)
        run: pip install -r requirements.txt
      - name: Submission consistency gate
        run: python scripts/check_submission_consistency.py
